id: lock-file
language: Rust
severity: error
message: Open a lock file with big_os_kit::file_io::open_lock_file
note: The owner refuses a symlink, a FIFO, another user's file and a second link, and keeps the mode at 0600; a function that opens a file and locks it is another copy.
# The owners live in the shared crates; the kit's own crates sit below them.
files:
  - shared/**
# The file a `let` opens with `OpenOptions::new()` is the one locked.
rule:
  kind: function_item
  all:
    - has:
        stopBy: end
        kind: let_declaration
        all:
          - has:
              field: pattern
              any:
                - kind: mut_pattern
                  has:
                    kind: identifier
                    pattern: $FILE
                - kind: identifier
                  pattern: $FILE
          - has:
              field: value
              stopBy: end
              kind: call_expression
              has:
                field: function
                regex: '(^|::)OpenOptions::new$'
    - has:
        stopBy: end
        any:
          - pattern: $FILE.try_lock()
          - pattern: $FILE.lock()
ignores:
  - shared/big-os-kit/src/file_io.rs
