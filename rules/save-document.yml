id: save-document
language: Rust
severity: error
message: Save a document under a chosen name with big_os_kit::storage::atomic_save_document
note: Creating the file and replacing it when it exists is one rule; the owner writes the file a link names rather than replacing the link with a file.
# The owners live in the shared crates; the kit's own crates sit below them.
files:
  - shared/**
rule:
  kind: match_expression
  all:
    - has:
        stopBy: end
        kind: identifier
        regex: '^atomic_create_document$'
    - has:
        stopBy: end
        kind: identifier
        regex: '^atomic_replace_document$'
ignores:
  - shared/big-os-kit/src/storage.rs
