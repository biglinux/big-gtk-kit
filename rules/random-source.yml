id: random-source
language: Rust
severity: error
message: Draw an unguessable id or token with big_os_kit::random::random_hex_id
note: The owner reads the kernel's random source and fails closed; a second read of it is another copy, and one that falls back to a clock or a counter is a weak token.
# The owners live in the shared crates; the kit's own crates sit below them.
files:
  - shared/**
rule:
  kind: string_literal
  regex: '/dev/u?random'
ignores:
  - shared/big-os-kit/src/random.rs
