id: crc32
language: Rust
severity: error
message: Compute a CRC-32 with big_os_kit::crc32::of
note: One table-driven CRC-32 serves PNG chunks, journals and tests; a loop over the polynomial is another copy of it.
# The owners live in the shared crates; the kit's own crates sit below them.
files:
  - shared/**
rule:
  kind: integer_literal
  regex: '^0x(?i:edb8_?8320)(?:_?u32)?$'
ignores:
  - shared/big-os-kit/src/crc32.rs
