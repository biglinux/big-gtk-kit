id: focus-within
language: Rust
severity: error
message: Use big_gtk_kit::focus::holds_focus, which reads the window's focus widget
note: GTK clears the FOCUS_WITHIN and FOCUSED state flags while the window is inactive, so a check on them loses the focus of a window the person will come back to.
rule:
  kind: scoped_identifier
  regex: 'StateFlags::FOCUS(_WITHIN|ED)$'
ignores:
  - src/focus.rs
  # Redraws when the flags change; it decides nothing by them.
  - big-item-view/src/view/imp.rs
  - '**/tests.rs'
  - '**/*_tests.rs'
  - '**/tests/**'
