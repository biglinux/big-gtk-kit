id: rgb-hex
language: Rust
severity: error
message: "Write a GDK color as #rrggbb with big_relm4_components::css::rgb_hex"
note: The owner clamps and rounds each channel in one place, so every program writes a color the same way.
# The owners live in the shared crates; the kit's own crates sit below them.
files:
  - shared/**
rule:
  kind: string_literal
  regex: '^"#\{:02x\}\{:02x\}\{:02x\}"$'
ignores:
  - shared/big-relm4-components/src/css.rs
  - "**/*_tests.rs"
  - "**/tests/**"
