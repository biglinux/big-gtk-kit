id: peer-credentials
language: Rust
severity: error
message: Read a socket peer's process or user through big_os_kit::microdaemon (peer_process_id, is_current_user_peer)
note: The owner reads SO_PEERCRED once, with the buffer size the kernel expects, and reports a failed read as an error rather than as pid 0.
# The owners live in the shared crates; the kit's own crates sit below them.
files:
  - shared/**
rule:
  kind: scoped_identifier
  regex: '(^|::)SO_PEERCRED$'
ignores:
  - shared/big-os-kit/src/microdaemon/socket.rs
