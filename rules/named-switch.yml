id: named-switch
language: Rust
severity: error
message: Build a row's switch with big_relm4_components::input::switch::named_switch
note: A row switch is centered and carries its own name for a screen reader, set in one place.
# The owners live in the shared crates; the kit's own crates sit below them.
files:
  - shared/**
rule:
  kind: let_declaration
  all:
    - has: {field: pattern, pattern: $S}
    - has: {field: value, pattern: 'gtk::Switch::builder().active($A).valign(gtk::Align::Center).build()'}
  precedes:
    pattern: $S.update_property(&[gtk::accessible::Property::Label($L)]);
ignores:
  - shared/big-relm4-components/src/input/switch.rs
