[package]
name = "big-gtk-kit"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/biglinux/big-gtk-kit"
description = "GTK4 building blocks shared by the BigLinux programs"
publish = false
exclude = ["upstream"]

[workspace]
members = ["big-item-view"]

[dependencies]
# The BigLinux GTK and libadwaita: no older library is supported.
gtk = { version = "0.11", features = ["v4_22"], package = "gtk4" }
adw = { version = "0.9", features = ["v1_9"], package = "libadwaita" }

[workspace.lints.rust]
deprecated = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
unwrap_used = "deny"
allow_attributes_without_reason = "deny"
unused_result_ok = "warn"
significant_drop_in_scrutinee = "warn"
unchecked_time_subtraction = "warn"
read_zero_byte_vec = "warn"
path_buf_push_overwrite = "warn"
debug_assert_with_mut_call = "warn"
unused_peekable = "warn"
redundant_clone = "warn"
implicit_clone = "warn"
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
unnecessary_join = "warn"
manual_instant_elapsed = "warn"
large_futures = "warn"
cast_lossless = "warn"
non_std_lazy_statics = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
ignore_without_reason = "warn"
should_panic_without_expect = "warn"
redundant_test_prefix = "warn"

[lints]
workspace = true
