[package]
name = "big-gtk-kit"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/biglinux/big-gtk-kit"
description = "GTK4 building blocks shared by the BigLinux programs"
publish = false

[workspace]
members = ["big-item-view"]

[dependencies]
# The BigLinux GTK and libadwaita: no older library is supported.
gtk = { version = "0.11", features = ["v4_22"], package = "gtk4" }
adw = { version = "0.9", features = ["v1_9"], package = "libadwaita" }
