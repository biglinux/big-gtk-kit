    { path = "libadwaita::AlertDialog::new", reason = "every dialog leaves three breakpoints behind when it goes (libadwaita 1.9, about 1.8 KB an opening); use `big_gtk_kit::alert::Alert::new`, which asks again with one already made when the parent is inside a resizable `AdwWindow` or `AdwApplicationWindow`" },
    { path = "libadwaita::AlertDialog::builder", reason = "every dialog leaves three breakpoints behind when it goes (libadwaita 1.9, about 1.8 KB an opening); use `big_gtk_kit::alert::Alert::builder`" },
    { path = "libadwaita::Dialog::new", reason = "every dialog leaves three breakpoints behind when it goes (libadwaita 1.9, about 1.8 KB an opening); use `big_gtk_kit::dialog::Dialog::new`, which shows one already made when the parent is inside a resizable `AdwWindow` or `AdwApplicationWindow`; one kept and presented again, or a Relm4 root, stays an `adw::Dialog` under `#[expect]`" },
