# The shared crates' Clippy settings: the GTK bans of ../clippy.toml routed to
# these crates' own wrappers, and the bans of the owners they hold. Clippy reads
# only the nearest clippy.toml, so the kit's own crates keep ../clippy.toml, the
# list every program copies.
# big-gtk-kit skip gio::Menu::append_section: the suite's structured renderer reads
# sections itself and they finalize (structured_menus_release_their_sections); a
# model handed to a native GtkPopoverMenu or MenuButton takes its sections from
# big_gtk_kit::menu.

# Clippy reads the MSRV from `rust-version`. Nothing here is published, so public
# items are judged too.
avoid-breaking-exported-api = false

allow-expect-in-tests = true
allow-unwrap-in-tests = true
allow-panic-in-tests = true

# Complexity thresholds
too-many-arguments-threshold = 8
type-complexity-threshold = 300

# Size thresholds
large-error-threshold = 256

# Names `doc_markdown` would otherwise ask to put in backticks.
doc-valid-idents = ["BigLinux", "FourCC", "GStreamer", "PipeWire", ".."]

# Raw process and stdin primitives bypass the workspace's argv, cancellation,
# timeout, and worker boundaries. Filesystem calls are reviewed at their actual
# call sites because this global list cannot distinguish UI work from workers,
# caches or tests; `std::fs::rename` is the exception, since every copy of an
# atomic write ends in one.
disallowed-methods = [
    { path = "libadwaita::prelude::AlertDialogExt::set_response_appearance", reason = "ask a question with a styled answer through big_relm4_components::feedback::confirm::confirm_destructive, big_relm4_components::feedback::confirm::confirm_suggested, big_relm4_components::feedback::save_question::ask_to_save or big_relm4_components::feedback::text_question::ask_text" },
    { path = "libc::getuid", reason = "ask big_os_kit::users::own_uid" },
    { path = "libc::geteuid", reason = "ask big_os_kit::microdaemon::current_effective_user_id, in microdaemon::socket" },
    { path = "libc::flock", reason = "lock a file with std::fs::File::lock, try_lock and unlock" },
    { path = "libc::sigaction", reason = "deliver signals as bytes on a pipe through big_os_kit::signal_pipe::install" },
    { path = "std::ptr::write_volatile", reason = "overwrite a secret with big_os_kit::secret_memory::wipe" },
    { path = "gtk4::DirectoryList::builder", reason = "a list it builds is watched, and crashes reading freed memory when it goes while a change in its folder is looked up (GTK 4.22 to 4.24); use `big_gtk_kit::directory::unwatched`, and make the list again when the folder changes" },
    { path = "gdk4_wayland::WaylandDisplay::wl_display", reason = "shares one wayland-client Connection between modules, each with its own copy of wayland-client: the second module aborts dispatching it; use `big_relm4_components::wayland`" },
    { path = "gdk4_wayland::prelude::WaylandSurfaceExtManual::wl_surface", reason = "shares one wayland-client Connection between modules, each with its own copy of wayland-client: the second module aborts dispatching it; use `big_relm4_components::wayland`" },
    { path = "gdk4_wayland::WaylandSeat::wl_seat", reason = "shares one wayland-client Connection between modules, each with its own copy of wayland-client: the second module aborts dispatching it; use `big_relm4_components::wayland`" },
    { path = "gdk4_wayland::WaylandMonitor::wl_output", reason = "shares one wayland-client Connection between modules, each with its own copy of wayland-client: the second module aborts dispatching it; use `big_relm4_components::wayland`" },
    { path = "gdk4_wayland::WaylandDevice::wl_seat", reason = "shares one wayland-client Connection between modules, each with its own copy of wayland-client: the second module aborts dispatching it; use `big_relm4_components::wayland`" },
    { path = "gdk4_wayland::WaylandDevice::wl_pointer", reason = "shares one wayland-client Connection between modules, each with its own copy of wayland-client: the second module aborts dispatching it; use `big_relm4_components::wayland`" },
    { path = "gdk4_wayland::WaylandDevice::wl_keyboard", reason = "shares one wayland-client Connection between modules, each with its own copy of wayland-client: the second module aborts dispatching it; use `big_relm4_components::wayland`" },
    { path = "gdk4_wayland::WaylandDisplay::wl_compositor", reason = "shares one wayland-client Connection between modules, each with its own copy of wayland-client: the second module aborts dispatching it; use `big_relm4_components::wayland`" },
    # GTK's own popover menus slide a submenu in over the menu that opened it.
    { path = "gtk4::PopoverMenu::from_model", reason = "slides a submenu in over the menu that opened it; use `big_relm4_components::layout::hamburger_menu::popover_menu`" },
    { path = "gtk4::PopoverMenu::from_model_full", reason = "the suite builds every popover menu one way; use `big_relm4_components::layout::hamburger_menu::popover_menu`" },
    { path = "gtk4::PopoverMenu::builder", reason = "slides a submenu in over the menu that opened it; use `big_relm4_components::layout::hamburger_menu::popover_menu`" },
    { path = "gtk4::MenuButton::set_menu_model", reason = "builds a popover menu that slides a submenu in over it; use `big_relm4_components::layout::hamburger_menu::set_menu_model_action_popover`, or `set_popover` with `hamburger_menu::popover_menu`" },
    { path = "gtk4::builders::MenuButtonBuilder::menu_model", reason = "builds a popover menu that slides a submenu in over it; use `big_relm4_components::layout::hamburger_menu::set_menu_model_action_popover`, or `set_popover` with `hamburger_menu::popover_menu`" },
    # A GtkScale takes the wheel over it, so scrolling a page moves its sliders.
    { path = "gtk4::Scale::new", reason = "takes every wheel turn over it, so scrolling a page moves the slider; use `big_gtk_kit::slider::with_range`" },
    { path = "gtk4::Scale::with_range", reason = "takes every wheel turn over it, so scrolling a page moves the slider; use `big_gtk_kit::slider::with_range`" },
    { path = "gtk4::builders::ScaleBuilder::build", reason = "takes every wheel turn over it, so scrolling a page moves the slider; pass the builder to `big_gtk_kit::slider::build`" },
