    { path = "gtk4::prelude::AccessibleExtManual::update_relation", reason = "leaks the list of targets on every call (gtk-rs 0.11); use `big_gtk_kit::accessible::relate`" },
    { path = "libadwaita::PasswordEntryRow::new", reason = "leaks its buffer and the password in it (libadwaita 1.9), and a screen reader says the title twice; use `big_relm4_components::input::entry_row::password(adw::PasswordEntryRow::builder())`" },
    { path = "libadwaita::builders::PasswordEntryRowBuilder::build", reason = "leaks its buffer and the password in it (libadwaita 1.9), and a screen reader says the title twice; pass the builder to `big_relm4_components::input::entry_row::password`" },
    { path = "big_gtk_kit::password::password_row", reason = "a screen reader says the title twice; pass the builder to `big_relm4_components::input::entry_row::password`" },
    { path = "libadwaita::EntryRow::new", reason = "both title labels name the row, and a screen reader says the title twice; use `big_relm4_components::input::entry_row::build(adw::EntryRow::builder())`" },
    { path = "libadwaita::builders::EntryRowBuilder::build", reason = "both title labels name the row, and a screen reader says the title twice; pass the builder to `big_relm4_components::input::entry_row::build`" },
    { path = "libadwaita::prelude::AlertDialogExtManual::choose", reason = "leaks the dialog (libadwaita-rs 0.9); use `big_gtk_kit::alert::Alert::choose`" },
    { path = "libadwaita::prelude::AlertDialogExtManual::choose_future", reason = "leaks the dialog (libadwaita-rs 0.9); use `big_gtk_kit::alert::Alert::choose_future`" },
    { path = "libadwaita::TimedAnimation::new", reason = "takes a second reference to the animation it creates (libadwaita-rs 0.9), so the animation and its target, with whatever the target holds, are never freed; use `adw::TimedAnimation::builder()`" },
    { path = "libadwaita::SpringAnimation::new", reason = "takes a second reference to the animation it creates (libadwaita-rs 0.9), so the animation and its target, with whatever the target holds, are never freed; use `adw::SpringAnimation::builder()`" },
    { path = "libadwaita::prelude::MessageDialogExtManual::choose", reason = "leaks the dialog (libadwaita-rs 0.9); use `big_gtk_kit::alert::Alert::choose`" },
    { path = "big_gtk_kit::alert::choose", reason = "takes any parent, and an Alert shown on a parent other than its own gives a Gtk-CRITICAL; use `big_gtk_kit::alert::Alert::choose`" },
    { path = "big_gtk_kit::alert::choose_future", reason = "takes any parent, and an Alert shown on a parent other than its own gives a Gtk-CRITICAL; use `big_gtk_kit::alert::Alert::choose_future`" },
    { path = "libadwaita::prelude::AdwWindowExt::add_breakpoint", reason = "the breakpoint outlives the window (libadwaita 1.9); use `big_gtk_kit::breakpoint::add`" },
